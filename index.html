<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Palette Gen", "url": "https://s3eidat.github.io/palette-gen/", "description": "Generate harmonious color palettes. Free, private and runs 100% in your browser: no sign-up, no uploads.", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any (web browser)", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "image": "https://s3eidat.github.io/palette-gen/screenshot.png", "author": {"@type": "Person", "name": "s3eidat", "url": "https://github.com/s3eidat"}}</script>

<body data-tool="palette-gen">
<main class="s3-main">
  <section class="s3-hero">
    <h1>Palette Gen</h1>
    <p>Press <kbd>Space</kbd> for a new harmonious palette. Lock the colours you like, tweak any of them, then export or share the link.</p>
  </section>

  <div class="row between pg-bar">
    <div class="row">
      <button class="btn primary" id="gen"><svg class="i"><use href="#i-refresh"/></svg>Generate <kbd class="pg-kbd">Space</kbd></button>
      <button class="btn" id="undo" disabled title="Undo (Ctrl+Z)">Undo</button>
    </div>
    <div class="seg" id="harmony" role="group" aria-label="Harmony">
      <button aria-pressed="true" data-v="auto">Auto</button>
      <button aria-pressed="false" data-v="analogous">Analogous</button>
      <button aria-pressed="false" data-v="complementary">Complementary</button>
      <button aria-pressed="false" data-v="triadic">Triadic</button>
      <button aria-pressed="false" data-v="split">Split</button>
      <button aria-pressed="false" data-v="mono">Mono</button>
    </div>
  </div>

  <section class="pg-swatches mt" id="swatches" aria-label="Palette"></section>

  <div class="grid-2 mt pg-lower">
    <section class="card stack">
      <div class="row between">
        <div class="seg" id="fmt" role="group" aria-label="Export format">
          <button aria-pressed="true" data-v="css">CSS</button>
          <button aria-pressed="false" data-v="tailwind">Tailwind</button>
          <button aria-pressed="false" data-v="json">JSON</button>
          <button aria-pressed="false" data-v="scss">SCSS</button>
        </div>
        <div class="row">
          <button class="btn small" id="copyOut"><svg class="i"><use href="#i-copy"/></svg>Copy</button>
          <button class="btn small" id="dlOut"><svg class="i"><use href="#i-download"/></svg>File</button>
        </div>
      </div>
      <pre class="out" id="out"></pre>
      <div class="row">
        <button class="btn" id="png"><svg class="i"><use href="#i-image"/></svg>Download PNG</button>
        <button class="btn" id="link"><svg class="i"><use href="#i-copy"/></svg>Copy share link</button>
        <button class="btn" id="save"><svg class="i"><use href="#i-heart"/></svg>Save palette</button>
      </div>
    </section>
    <section class="card stack">
      <div class="row between"><h2>Saved palettes <small id="savedCount"></small></h2></div>
      <div id="saved" class="pg-saved"></div>
      <p class="faint">Saved in this browser only.</p>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
